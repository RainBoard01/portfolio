server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/xml
        image/svg+xml
        text/css
        text/plain;

    # Locations only change this variable, so the security headers declared at
    # server level remain inherited everywhere.
    set $cache_policy "no-cache";

    add_header Cache-Control $cache_policy always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https: mailto:; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https:; media-src 'self' https:; manifest-src 'self'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        set $cache_policy "no-store";
        return 200 "ok\n";
    }

    # Astro fingerprints files in this directory. They are safe to cache for a
    # year because a content change produces a different URL.
    location ^~ /_astro/ {
        set $cache_policy "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Public images and fonts are not guaranteed to be fingerprinted, so use a
    # shorter policy that still reduces repeat requests.
    location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?)$ {
        set $cache_policy "public, max-age=604800, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:pdf|txt|xml|webmanifest)$ {
        set $cache_policy "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
        set $cache_policy "no-cache";
    }

    location / {
        # Astro is configured with trailingSlash: "never". Keep one canonical
        # URL while still serving directory-format HTML internally.
        if ($uri ~ ^(.+)/+$) {
            return 308 $1$is_args$args;
        }

        try_files $uri.html $uri/index.html $uri =404;
    }
}
